  - id: httpapi-protecting-credentials-06
    title: Protecting Credentials with HTTP APIs
    artifact_type: ietf_best_current_practice_draft
    lifecycle_decision: profile
    external_status: Revision 06; approved as a Best Current Practice; RFC Editor queue, In Progress
    verified_on: 2026-07-26
    primary_sources:
      - https://datatracker.ietf.org/doc/draft-ietf-httpapi-privacy/
      - https://www.ietf.org/archive/id/draft-ietf-httpapi-privacy-06.html
    current_dr_use:
      - Forward-adopted requirement that credential-bearing HTTP requests start on validated HTTPS
      - Source for non-oracular rejection and compromised-credential treatment after insecure disclosure
    non_claims:
      - Published BCP
      - An HTTPS redirect repairs prior plaintext credential disclosure
      - The BCP replaces DR-0001 destination validation, SSRF, issuer, or redirect controls
    adoption_triggers:
      - RFC number assignment or publication followed by a source-level delta review
      - Material change to credential definition, secure-transport, rejection, or compromise guidance
    fallback_controls:
      - Never send reusable credentials over plaintext HTTP
      - Validate the destination before transmission and revoke or rotate potentially disclosed credentials
    responsible_domain: http-credential-security
    next_review_on: 2026-08-26
    affected_sections:
      - document: DR-0001
        sections: ["1.2", "18.3.8"]
    match_terms: ["Protecting Credentials with HTTP APIs"]
    status_history:
