    fallback_controls:
      - Preserve decision false until a verified approval is supplied to a fresh evaluation
      - Pin metadata, endpoint, signer, schema, and exact-match/reuse behavior
      - Keep local workflow, idempotency, effect, cancellation, and result-release controls
