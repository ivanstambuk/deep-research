  - id: mcp-oauth-client-credentials-draft
    title: MCP OAuth Client Credentials Extension
    artifact_type: mcp_extension_draft
    lifecycle_decision: profile
    external_status: Protocol Revision draft at ext-auth commit fb374c7db2b34f18ca9183882e0beecdf661892b; related SEP-1046 is Final
    verified_on: 2026-07-25
    primary_sources:
      - https://raw.githubusercontent.com/modelcontextprotocol/ext-auth/fb374c7db2b34f18ca9183882e0beecdf661892b/specification/draft/oauth-client-credentials.mdx
      - https://modelcontextprotocol.io/seps/1046-support-oauth-client-credentials-flow-in-authoriza
    current_dr_use:
      - Revision-pinned optional direct machine-authority profile for HTTP-based MCP transports
      - Profile requiring preregistration and authorization-server metadata advertising private_key_jwt or client_secret_basic
    non_claims:
      - Stable or final MCP extension merely because SEP-1046 is Final
      - Dynamic Client Registration, human identity, user consent, refresh-token issuance, or a universal MCP capability-negotiation handshake
    adoption_triggers:
      - Extension advances from Protocol Revision draft to a stable revision
      - Draft and SEP-1046 reconcile the client-secret transport example
      - Interoperability evidence for preregistration, discovery, client authentication, resource binding, and MCP request enforcement
    fallback_controls:
      - Use issuer-bound preregistration and private_key_jwt for the DR-0001 canonical profile
      - Reacquire access tokens before expiry rather than assume a refresh token
      - Keep machine-principal authority and downstream token custody explicit
    responsible_domain: machine-authorization
    next_review_on: 2026-08-25
    affected_sections:
      - document: DR-0001
        sections: ["14.6"]
    match_terms: ["Client Credentials", "Machine-to-Machine"]
    status_history:
      - on: 2025-07-23
        status: SEP-1046 created
      - on: 2026-07-25
        status: Extension remains Protocol Revision draft while SEP-1046 is Final

