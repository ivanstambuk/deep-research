      - https://github.com/openid/authzen/tree/6fb7fa85c86acda14710f9f0f161da9aaa801a45
    current_dr_use:
      - Revision-pinned requestable-denial, bound Access Request, workflow task, approval, and fresh-evaluation profile
      - Canonical standards-facing lifecycle for resource-side approval with local reliability and effect controls
    non_claims:
      - OpenID Final Specification or profile-specific interoperability/certification evidence
