  - id: oauth-identity-chaining-17
    title: OAuth Identity and Authorization Chaining Across Domains
    artifact_type: ietf_working_group_draft
    lifecycle_decision: profile
    external_status: Revision 17; submitted for publication; RFC Editor queue, In Progress
    verified_on: 2026-07-26
    primary_sources:
      - https://datatracker.ietf.org/doc/draft-ietf-oauth-identity-chaining/
      - https://www.ietf.org/archive/id/draft-ietf-oauth-identity-chaining-17.html
    current_dr_use:
      - Canonical revision-pinned two-domain identity and authorization chaining profile
      - RFC 8693 exchange in Domain A followed by an RFC 7523 JWT authorization grant to Domain B
      - Product-evidence discriminator for exact two-leg support versus component or adjacent support
    non_claims:
      - Published RFC
      - Automatic trust in upstream issuers, unrestricted claim copying, or authorization for MCP application objects
      - Proof that a generic token-exchange feature implements the two-domain profile
    adoption_triggers:
      - RFC number assignment or publication followed by a source-level delta review
      - Material change to the required Domain A issuer, Domain B client, or claim-transcription semantics
    fallback_controls:
      - Pin revision 17
      - Use separately governed single-domain RFC 8693 exchange where no cross-domain bridge is required
      - Validate the full trust and authorization chain and issue a local audience-bound token
    responsible_domain: federation-architecture
    next_review_on: 2026-08-02
    affected_sections:
      - document: DR-0001
        sections: ["5.6", "8.7", "20.4", "25.2", "25.9", "26"]
    match_terms: ["Identity Chaining", "Identity and Authorization Chaining"]
    status_history:
      - on: 2026-07-19
        status: Revision 17 published
      - on: 2026-07-25
        status: RFC Editor queue, In Progress
      - on: 2026-07-26
        status: Queue and revision revalidated; canonical DR-0001 integration completed

